<footer class="footer">
  <!-- Tab Başlıkları -->
  <div class="footer__tabs">
    <button
      class="footer__tab"
      [class.footer__tab--active]="activeTab === 'merkez'"
      (click)="activeTab = 'merkez'"
    >
      Merkez
    </button>
    <button
      class="footer__tab"
      [class.footer__tab--active]="activeTab === 'sube'"
      (click)="activeTab = 'sube'"
    >
      Şube
    </button>
  </div>

  <!-- Konum Bilgileri -->
  <div class="footer__info">
    <p class="footer__phone">{{ currentLocation.phone }}</p>
    <p class="footer__address">{{ currentLocation.address }} /</p>
    <p class="footer__email">{{ currentLocation.email }}</p>
  </div>

  <!-- Harita -->
  <div class="footer__map">

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12093.123456789012!2d28.9784!3d41.0082!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caa9b123456789%3A0xabcdef1234567890!2sTaksim%20Square%2C%20Istanbul%2C%20Turkey!5e0!3m2!1sen!2sus!4v1610000000000"
        width="100%"
        height="300"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        [class]=" activeTab === 'merkez' ? 'block' : 'hid'"
      ></iframe>

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3006.711861339268!2d28.785936989624478!3d41.097141840056715!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caaf6a14234375%3A0xba68b2521c94638c!2zQmHFn2FrIEtvbnV0bGFyxLE!5e0!3m2!1str!2sus!4v1776858477005!5m2!1str!2sus"
        width="100%"
        height="300"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        [class]=" activeTab === 'sube' ? 'block' : 'hid'"
      ></iframe>

  </div>

  <!-- Alt Bar -->
  <div class="footer__bottom">
    <p class="footer__copyright">© 2021 <strong>Tulpar Jet</strong> Tüm hakkı saklıdır.</p>

    <nav class="footer__nav">
      <a href="#" class="footer__nav-link">Hakkımızda</a>
      <a href="#" class="footer__nav-link">İş jetleri</a>
      <a href="#" class="footer__nav-link">Özel uçuşlar</a>
      <a href="#" class="footer__nav-link">Uçak kiralama maliyeti</a>
      <a href="#" class="footer__nav-link">Haberler</a>
    </nav>

    <div class="footer__social">
      <!-- Instagram -->
      <a href="#" class="footer__social-link" aria-label="Instagram">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <!-- VK -->
      <a href="#" class="footer__social-link" aria-label="VK">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M20.656 8.383c.143-.426 0-.74-.613-.74h-2.02c-.516 0-.754.272-.897.573 0 0-1.047 2.55-2.531 4.208-.48.48-.699.633-.961.633-.13 0-.32-.153-.32-.579V8.383c0-.514-.15-.74-.578-.74H9.828c-.32 0-.514.238-.514.464 0 .486.727.6.8 1.966v2.97c0 .652-.118.77-.379.77-.699 0-2.4-2.562-3.409-5.494-.198-.573-.398-.804-.916-.804H3.391c-.578 0-.694.272-.694.573 0 .537.699 3.196 3.254 6.714 1.703 2.446 4.1 3.77 6.285 3.77 1.309 0 1.471-.294 1.471-.8v-1.817c0-.578.122-.694.529-.694.3 0 .814.15 2.015 1.309 1.372 1.372 1.598 1.987 2.371 1.987h2.02c.578 0 .868-.294.7-.872-.183-.576-.851-1.412-1.74-2.403-.48-.566-1.2-1.178-1.418-1.483-.3-.384-.214-.553 0-.894z"
          />
        </svg>
      </a>
      <!-- Facebook -->
      <a href="#" class="footer__social-link" aria-label="Facebook">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
        </svg>
      </a>
    </div>
  </div>
</footer>
