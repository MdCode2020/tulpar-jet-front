<footer class="footer">
  <!-- Tab Başlıkları -->
  <div class="footer__tabs">
    <button
      class="footer__tab"
      [class.footer__tab--active]="activeTab === 'merkez'"
      (click)="activeTab = 'merkez'"
    >
      Merkez
    </button>
    <button
      class="footer__tab"
      [class.footer__tab--active]="activeTab === 'sube'"
      (click)="activeTab = 'sube'"
    >
      Şube
    </button>
  </div>

  <!-- Konum Bilgileri -->
  <div class="footer__info">
    <p class="footer__phone">{{ currentLocation.phone }}</p>
    <p class="footer__address">{{ currentLocation.address }} /</p>
    <p class="footer__email">{{ currentLocation.email }}</p>
  </div>

  <!-- Harita -->
  <div class="footer__map">
    @if (currentSafeUrl) {
      <iframe
        [src]="currentSafeUrl"
        width="100%"
        height="300"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
      ></iframe>
    }
  </div>

  <!-- Alt Bar -->
  <div class="footer__bottom">
    <p class="footer__copyright">© {{ currentYear }} <strong>Tulpar Jet</strong> Tüm hakkı saklıdır.</p>

    <div class="footer__social">
      <!-- Facebook -->
      <a *ngIf="socialLinks?.facebook" [href]="socialLinks!.facebook" target="_blank" rel="noopener noreferrer" class="footer__social-link" aria-label="Facebook">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
        </svg>
      </a>
      <!-- Twitter / X -->
      <a *ngIf="socialLinks?.twitter" [href]="socialLinks!.twitter" target="_blank" rel="noopener noreferrer" class="footer__social-link" aria-label="Twitter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
        </svg>
      </a>
      <!-- Instagram -->
      <a *ngIf="socialLinks?.instagram" [href]="socialLinks!.instagram" target="_blank" rel="noopener noreferrer" class="footer__social-link" aria-label="Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <!-- LinkedIn -->
      <a *ngIf="socialLinks?.linkedIn" [href]="socialLinks!.linkedIn" target="_blank" rel="noopener noreferrer" class="footer__social-link" aria-label="LinkedIn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
          <rect x="2" y="9" width="4" height="12" />
          <circle cx="4" cy="4" r="2" />
        </svg>
      </a>
      <!-- YouTube -->
      <a *ngIf="socialLinks?.youTube" [href]="socialLinks!.youTube" target="_blank" rel="noopener noreferrer" class="footer__social-link" aria-label="YouTube">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.97C18.88 4 12 4 12 4s-6.88 0-8.59.45A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.97C5.12 20 12 20 12 20s6.88 0 8.59-.45a2.78 2.78 0 0 0 1.95-1.97A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z" />
          <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="#0d1b3e" />
        </svg>
      </a>
    </div>
  </div>
</footer>
