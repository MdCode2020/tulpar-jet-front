<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tulpar Jet</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app-loader">
      <div class="loader-plane">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2A1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1l3.5 1v-1.5L13 19v-5.5z"/>
        </svg>
      </div>
    </div>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #131e41;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s ease;
      }
      .loader-plane {
        color: #ffffff;
        width: 56px;
        height: 56px;
        animation: plane-spin 0.9s linear infinite;
      }
      .loader-plane svg {
        width: 100%;
        height: 100%;
      }
      @keyframes plane-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <app-root></app-root>
  </body>
</html>
